name: Build and deploy the Flock website
on:
  push:
    branches:
      main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze build code
        run: dart analyze bin lib test tools

      - name: Run tests
        run: dart test

      - name: Test hero compatibility
        run: node --test test/hero_glow_test.cjs

      - name: Pre-render the site with Jaspr
        run: dart run bin/main.dart --refresh-commits
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
